services:
  postgres:
    image: postgres:16-alpine
    container_name: wishlist_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: wishlist_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wishlist_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: wishlist_api
    ports:
      - "8080:8080"
    environment:
      CONN_STRING: "postgres://postgres:secret@postgres:5432/wishlist_db?sslmode=disable"
      SECRET_KEY: "secret_key"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data: